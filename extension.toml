id = "toolbox-laravel"
name = "Toolbox for Laravel"
version = "0.0.1"
schema_version = 1
authors = ["Harris Raftopoulos"]
description = "Full Laravel support for Zed: Blade templates, route/view/config intelligence, Pint formatting, snippets, and more."
repository = "https://github.com/harris21/zed-laravel-extension"

[grammars.blade]
repository = "https://github.com/EmranMR/tree-sitter-blade"
commit = "cc764dadcbbceb3f259396fef66f970c72e94f96"

[grammars.php_only]
repository = "https://github.com/tree-sitter/tree-sitter-php"
commit = "b2278dbac9d58b02653fe6a8530ccebc492e4ed4"
path = "php_only"

[language_servers.laravel-lsp]
name = "Laravel LSP"
languages = ["Blade", "PHP"]

[[capabilities]]
kind = "npm:install"
package = "laravel-lsp-server"
